version: 2

project_name: indiansql

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: indsql

    main: ./cmd/indsql

    binary: indsql

    env:
      - CGO_ENABLED=0

    goos:
      - linux
      - windows
      - darwin

    goarch:
      - amd64
      - arm64

archives:
  - id: default

    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- .Os }}_
      {{- .Arch }}

    formats:
      - tar.gz

    format_overrides:
      - goos: windows
        formats:
          - zip

    files:
      - README.md
      - LICENSE
      - examples/**

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-dev"

changelog:
  use: github

release:
  draft: false
  prerelease: auto